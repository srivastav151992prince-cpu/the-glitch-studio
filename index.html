<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Glitch: Advanced AI Film Studio</title>
  <meta name="theme-color" content="#0d0f17">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap');
    body { font-family: 'Fira Code', monospace; background-color: #0d0f17; color: #00f0ff; overflow-x: hidden; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .scanlines { background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.4) 50%); background-size: 100% 4px; }
    .neon-glow { box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); border: 1px solid #00f0ff; }
  </style>
</head>
<body class="min-h-screen w-screen flex flex-col justify-between">
  <!-- Header -->
  <header class="p-3 bg-slate-950 border-b border-cyan-500/30 flex justify-between items-center sticky top-0 z-20">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
      <span class="font-orbitron text-xs sm:text-sm font-bold tracking-wider text-cyan-400">THE GLITCH // AI STUDIO</span>
    </div>
    <span class="text-[10px] px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-800">ADVANCED PWA</span>
  </header>

  <!-- Studio Viewport -->
  <main class="flex-1 flex flex-col justify-center items-center bg-black p-4">
    <div class="relative w-full max-w-lg aspect-video bg-slate-900 rounded-lg overflow-hidden neon-glow flex flex-col items-center justify-center">
      <canvas id="aiCanvas" class="w-full h-full object-cover"></canvas>
      <div class="scanlines absolute inset-0 pointer-events-none opacity-40"></div>
      
      <div id="aiStatusBadge" class="absolute top-2 left-2 text-[10px] bg-black/80 px-2.5 py-1 rounded text-orange-400 font-bold border border-orange-500/40 flex items-center space-x-1.5 hidden">
        <span class="w-2 h-2 rounded-full bg-orange-500 animate-ping"></span>
        <span id="statusText">GENERATING AI MOVIE SHOT...</span>
      </div>

      <div id="promptDisplay" class="absolute inset-x-4 bottom-4 text-center text-xs sm:text-sm text-cyan-300 bg-black/80 py-2 px-3 rounded-md border border-cyan-500/40 font-bold tracking-wide shadow-lg">
        Type your prompt below & tap "GENERATE"
      </div>
    </div>
  </main>

  <!-- Controls -->
  <div class="p-4 bg-slate-950 border-t border-cyan-500/30 flex flex-col space-y-3 z-20">
    <div class="flex flex-col space-y-1">
      <label class="text-[10px] text-cyan-400 font-orbitron tracking-wider">AI MOVIE PROMPT ENGINE:</label>
      <div class="flex space-x-2">
        <input type="text" id="userPrompt" placeholder="e.g., Cyberpunk hacker in neon city, cinematic 4K..." class="flex-1 bg-slate-900 border border-cyan-500/50 rounded px-3 py-2 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400">
        <button onclick="generateAIAsset()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-black font-orbitron font-bold text-xs rounded tracking-wider shadow-md active:scale-95 transition">
          GENERATE
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 pt-1">
      <button onclick="playSequence()" class="py-2.5 bg-slate-900 hover:bg-slate-800 border border-cyan-500/40 text-cyan-300 font-orbitron font-bold text-xs rounded tracking-widest active:scale-95 transition">
        PREVIEW MOVIE
      </button>
      <button onclick="exportMovie()" class="py-2.5 bg-orange-600 hover:bg-orange-500 text-black font-orbitron font-bold text-xs rounded tracking-widest shadow-lg active:scale-95 transition">
        EXPORT MASTER MP4
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('aiCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 854;
    canvas.height = 480;

    let frame = 0;
    let isGenerating = false;

    function drawScene() {
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#00f0ff22';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      ctx.fillStyle = isGenerating ? '#ff6e00' : '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = isGenerating ? '#ff6e00' : '#00f0ff';
      
      ctx.beginPath();
      let radius = 60 + Math.sin(frame * 0.1) * 20;
      ctx.arc(canvas.width / 2, canvas.height / 2 - 20, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      for(let i=0; i<20; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#00f0ff' : '#ff6e00';
        let px = (Math.sin(frame * 0.05 + i) * 350) + canvas.width/2;
        let py = (Math.cos(frame * 0.05 + i * 1.5) * 150) + canvas.height/2;
        ctx.fillRect(px, py, 4, 4);
      }

      frame++;
      requestAnimationFrame(drawScene);
    }

    drawScene();

    function generateAIAsset() {
      const promptInput = document.getElementById('userPrompt').value.trim();
      if (!promptInput) {
        alert('Please enter a prompt first!');
        return;
      }

      isGenerating = true;
      document.getElementById('aiStatusBadge').classList.remove('hidden');
      document.getElementById('promptDisplay').innerText = `AI Generating: "${promptInput}"...`;

      setTimeout(() => {
        isGenerating = false;
        document.getElementById('aiStatusBadge').classList.add('hidden');
        document.getElementById('promptDisplay').innerText = `Active Shot: ${promptInput}`;
        alert('✨ AI Video Shot Successfully Generated!');
      }, 2500);
    }

    function playSequence() {
      alert('▶ Playing Full AI Movie Sequence...');
    }

    function exportMovie() {
      alert('🎥 Rendering Master Movie File...');
    }
  </script>
</body>
</html>
